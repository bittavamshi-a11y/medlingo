<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDLINGO — Doctors</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="extra.css"></head><body>
<div id="hdr"></div><div class="page"><h1>Which doctor should I see?</h1><p class="lede">Search a symptom, body area or doctor name. Call or consult directly from here.</p>
<input type="text" id="q" placeholder="fever, tooth, skin, knee..." style="width:min(420px,100%);margin:14px 0 24px">
<div class="caregrid" id="grid" style="grid-template-columns:repeat(auto-fill,minmax(290px,1fr))"></div>
<h2 id="helpT" style="margin-top:40px;font-family:Manrope,sans-serif"></h2>
<div class="panel helplist" id="help" style="padding:6px 18px;max-width:520px"></div></div>
<script src="common.js"></script><script src="doctors-data.js"></script>
<script>
// Specialists and doctors are edited in doctors-data.js
const g=document.getElementById("grid"),q=document.getElementById("q");
function draw(){const s=q.value.toLowerCase();g.innerHTML="";
  SPECIALTIES.forEach(sp=>{const docs=DOCTORS.filter(d=>d.key===sp.key);
    if(!(sp.name+" "+sp.treats+" "+docs.map(d=>d.name+" "+d.hospital).join(" ")).toLowerCase().includes(s))return;
    const a=document.createElement("article");
    const ic=document.createElement("span");ic.className="careicon teal";ic.textContent="✚";
    const h=document.createElement("h3");h.textContent=sp.name;
    const p=document.createElement("p");p.textContent=sp.treats;
    a.append(ic,h,p);docs.forEach(d=>a.appendChild(doctorEl(d)));g.appendChild(a)})}
q.oninput=draw;draw();
document.getElementById("helpT").textContent=M.t2(8);renderHelplines(document.getElementById("help"));
</script></body></html>
